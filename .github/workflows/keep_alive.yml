name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 12 hours (adjust the cron schedule as needed)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows me to trigger it manually

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request to Streamlit App
        run: curl -s -o /dev/null -w "%{http_code}\n" https://public-data-insights-dashboard.streamlit.app/
